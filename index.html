<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // Suppress Vite HMR / WebSocket connection errors in AI Studio Cloud Run iframe
        function isViteWsError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err || '');
          var stack = String(err.stack || '');
          return str.includes('WebSocket') ||
                 str.includes('createWebSocketModuleRunnerTransport') ||
                 str.includes('closed without opened') ||
                 stack.includes('@vite/client') ||
                 stack.includes('createWebSocketModuleRunnerTransport');
        }

        window.addEventListener('error', function(e) {
          if (isViteWsError(e) || (e.filename && e.filename.includes('@vite/client'))) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);

        // Intercept WebSocket when requested with 'vite-hmr' protocol to prevent closed error
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var DummyWebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('24678')))) {
              var handlers = {};
              var dummy = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (!handlers[type]) handlers[type] = [];
                  handlers[type].push(listener);
                  if (type === 'open') {
                    setTimeout(listener, 10);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (handlers[type]) {
                    handlers[type] = handlers[type].filter(function(l) { return l !== listener; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return dummy;
            }
            return new OrigWebSocket(url, protocols);
          };
          DummyWebSocket.prototype = OrigWebSocket.prototype;
          DummyWebSocket.CONNECTING = 0;
          DummyWebSocket.OPEN = 1;
          DummyWebSocket.CLOSING = 2;
          DummyWebSocket.CLOSED = 3;
          window.WebSocket = DummyWebSocket;
        }
      })();
    </script>
